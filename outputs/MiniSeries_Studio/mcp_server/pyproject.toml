[project]
name = "vertical-studio-mcp"
version = "0.1.0"
description = "MCP server exposing Runway, ElevenLabs and CapCut-manifest tools for the 4-series vertical mini-series studio."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
vertical-studio-mcp = "vertical_studio_mcp.server:main"
vertical-studio-keys = "vertical_studio_mcp.keys:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vertical_studio_mcp"]
